<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frame Studio Flythrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#070B16;--ink:#F4F1EA;--ink2:#B9C0D4;--clay:#D9774F;--cyan:#57E3FF;--line:rgba(255,255,255,.14)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
canvas{display:block}
#stage{position:fixed;inset:0}
.cap{position:fixed;left:clamp(16px,4vw,44px);bottom:clamp(64px,10vh,96px);max-width:min(560px,calc(100vw - 32px));pointer-events:none}
.cap .ch{font:600 11px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);opacity:.9}
.cap h1{font:700 clamp(24px,4.2vw,46px)/1.05 'Bricolage Grotesque',sans-serif;margin:10px 0 10px;letter-spacing:-.01em;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.cap p{margin:0;font-size:clamp(14px,1.6vw,17px);line-height:1.5;color:var(--ink2);text-shadow:0 1px 12px rgba(0,0,0,.8)}
.cap .in{transition:opacity .6s ease,transform .6s ease}
.cap .in.out{opacity:0;transform:translateY(10px)}
.bar{position:fixed;left:clamp(16px,4vw,44px);right:clamp(16px,4vw,44px);bottom:clamp(18px,4vh,34px);display:flex;align-items:center;gap:10px}
.bar button{appearance:none;border:1px solid var(--line);background:rgba(10,14,28,.72);color:var(--ink);font:600 12px Inter,sans-serif;padding:7px 12px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px);white-space:nowrap}
.bar button:hover{border-color:rgba(255,255,255,.4)}
.bar button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.prog{flex:1;display:flex;gap:4px;height:22px;align-items:center;cursor:pointer}
.prog i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.16);position:relative;overflow:hidden}
.prog i b{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--clay),#F2B38F)}
.prog i:hover{background:rgba(255,255,255,.28)}
.end{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(7,11,22,.35),rgba(7,11,22,.82));opacity:0;pointer-events:none;transition:opacity .8s ease}
.end.on{opacity:1;pointer-events:auto}
.end .card{text-align:center;padding:24px;max-width:560px}
.end h2{font:700 clamp(26px,4vw,44px)/1.1 'Bricolage Grotesque',sans-serif;margin:0 0 10px}
.end p{color:var(--ink2);margin:0 0 22px;line-height:1.5}
.end .go{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.end a,.end button{appearance:none;text-decoration:none;font:600 14px Inter,sans-serif;padding:11px 18px;border-radius:999px;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink)}
.end .pri{background:var(--clay);border-color:var(--clay);color:#1A0F0A}
.hint{position:fixed;top:14px;left:50%;transform:translateX(-50%);font:500 12px Inter,sans-serif;color:var(--ink2);background:rgba(10,14,28,.72);border:1px solid var(--line);padding:6px 12px;border-radius:999px;opacity:0;transition:opacity .4s;pointer-events:none}
.hint.on{opacity:1}
.fail{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--ink2)}
@media (max-width:560px){.bar .opt{display:none}}
</style>
</head>
<body>
<div id="stage" aria-hidden="true"></div>
<div class="cap" aria-live="polite"><div class="in" id="capIn"><div class="ch" id="capCh"></div><h1 id="capH"></h1><p id="capP"></p></div></div>
<div class="bar" role="group" aria-label="Flythrough controls">
  <button type="button" id="play" aria-label="Pause">Pause</button>
  <div class="prog" id="prog" role="slider" aria-label="Tour position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"></div>
  <button type="button" id="free" class="opt">Take the controls</button>
  <button type="button" id="full" class="opt" aria-label="Full screen">Full screen</button>
</div>
<div class="hint" id="hint">Drag to look around, scroll to zoom. Resume the tour any time.</div>
<div class="end" id="end">
  <div class="card">
    <h2>Now walk it yourself</h2>
    <p>Every stop in this tour is a working app on sample data: the engine, the formulas, the model's data flow, the frame and the world behind it.</p>
    <div class="go">
      <a class="pri" href="../#graphite" data-view="graphite">Start the path</a>
      <a href="../#frame-world" data-view="frame-world">Walk the Frame</a>
      <button type="button" id="again">Watch again</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function () {
'use strict';
if (!window.THREE) { document.body.innerHTML = '<div class="fail">The 3D library did not load. Check your connection and reload.</div>'; return; }
var T = THREE, FONT = 'Inter, system-ui, sans-serif', HEAD = "'Bricolage Grotesque', Inter, sans-serif";
var reduce = false; try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
var C = { bg: 0x070B16, clay: '#D9774F', cyan: '#57E3FF', blue: '#5B8DEF', violet: '#9B7BFF', yellow: '#F4C152', pink: '#F27BA7', teal: '#3DD6B5', ink: '#F4F1EA', claude: '#D97757' };

/* ---------------- renderer, scene, bloom ---------------- */

function clamp01(u) { return u < 0 ? 0 : u > 1 ? 1 : u; }

/* ---------------- backdrop: stars and a fading grid ---------------- */
(function () {

  var grid = new T.GridHelper(400, 100, 0x1c2a4a, 0x111a30); grid.position.y = -0.02; scene.add(grid);

/* ---------------- act 1-2: the frame and its layers ---------------- */
var DASH_Y = 30, layers = [];
var ACT = [31.8, 31.9, 33.5, 34.4, 35.2, 36.2, 37.1, 38.9], BUD = [31.6, 31.9, 33.4, 34.3, 35.2, 36.2, 38.0, 40.0, 43.5, 48.0, 57.5, 58.7];
var dashTex = canvasTex(2048, 1180, function (g, W, H) {

  g.fillStyle = '#8D97B5'; g.font = '500 34px ' + FONT; g.fillText('Net revenue in US dollars · actual vs budget · sample data', 82, 188);
  var K = [['Net revenue to date', '$202.0M', '+24.6% vs last year', C.teal], ['Against budget', '-0.3%', '$576K behind plan', C.pink], ['Exchange-rate effect', '$9.4M', 'reported vs budget rates', C.yellow], ['Leading channel', 'Direct', '47.6% of revenue', C.cyan]];
  K.forEach(function (k, i) { var x = 80 + i * 482; g.fillStyle = '#151D35'; rr(g, x, 240, 450, 230, 24); g.fill(); g.fillStyle = '#8D97B5'; g.font = '600 28px ' + FONT; g.fillText(k[0].toUpperCase(), x + 30, 298); g.fillStyle = k[3]; g.font = '700 82px ' + HEAD; g.fillText(k[1], x + 28, 398); g.fillStyle = '#8D97B5'; g.font = '500 28px ' + FONT; g.fillText(k[2], x + 30, 446); });
  var x0 = 80, y0 = 540, w = 1880, h = 560; g.fillStyle = '#151D35'; rr(g, x0, y0, w, h, 24); g.fill();
  g.fillStyle = '#8D97B5'; g.font = '600 28px ' + FONT; g.fillText('NET REVENUE BY MONTH: ACTUAL VS BUDGET', x0 + 30, y0 + 56);
  var px = function (i) { return x0 + 90 + i * (w - 180) / 11; }, py = function (v) { return y0 + h - 60 - (v - 28) / 34 * (h - 150); };
  g.strokeStyle = 'rgba(255,255,255,.08)'; g.lineWidth = 2; for (var q = 0; q < 5; q++) { g.beginPath(); g.moveTo(x0 + 60, y0 + 110 + q * 95); g.lineTo(x0 + w - 40, y0 + 110 + q * 95); g.stroke(); }

  g.strokeStyle = C.clay; g.lineWidth = 9; g.lineJoin = 'round'; g.beginPath(); ACT.forEach(function (v, i) { if (i) g.lineTo(px(i), py(v)); else g.moveTo(px(i), py(v)); }); g.stroke();

});
var dashGroup = new T.Group(); dashGroup.position.set(0, DASH_Y, 0); scene.add(dashGroup);
var dash = new T.Mesh(new T.PlaneGeometry(26, 15), new T.MeshBasicMaterial({ map: dashTex, transparent: true, fog: true })); dashGroup.add(dash);
var dashEdge = new T.LineSegments(new T.EdgesGeometry(new T.PlaneGeometry(26.4, 15.4)), new T.LineBasicMaterial({ color: 0xD9774F, transparent: true, opacity: 0.9 })); dashGroup.add(dashEdge);
function layerTex(kind) {

    g.strokeStyle = kind === 'logic' ? 'rgba(87,227,255,.9)' : 'rgba(155,123,255,.95)'; g.lineWidth = 4; rr(g, 6, 6, W - 12, H - 12, 22); g.stroke();
    g.fillStyle = kind === 'logic' ? 'rgba(87,227,255,.07)' : 'rgba(155,123,255,.08)'; rr(g, 6, 6, W - 12, H - 12, 22); g.fill();
    g.font = '600 30px ' + FONT; g.fillStyle = kind === 'logic' ? C.cyan : '#C4B2FF'; g.fillText(kind === 'logic' ? 'FRAME LOGIC' : 'PIGMENT BLOCKS', 36, 62);
    if (kind === 'logic') {

      g.font = '500 34px ui-monospace, Menlo, monospace'; lines.forEach(function (l, i) { g.fillStyle = 'rgba(223,246,255,.85)'; g.fillText(l, 40, 140 + i * 70); });
      g.strokeStyle = 'rgba(87,227,255,.5)'; g.lineWidth = 3; for (var i = 0; i < 5; i++) { g.beginPath(); g.arc(160 + i * 180, 480, 22, 0, 7); g.stroke(); if (i) { g.beginPath(); g.moveTo(160 + (i - 1) * 180 + 22, 480); g.lineTo(160 + i * 180 - 22, 480); g.stroke(); } }
    } else {
      var cols = [C.yellow, C.blue, C.violet, C.violet, C.pink];

  });

['logic', 'blocks'].forEach(function (k, i) { var m = new T.Mesh(new T.PlaneGeometry(26, 15), new T.MeshBasicMaterial({ map: layerTex(k), transparent: true, opacity: 0, depthWrite: false, side: T.DoubleSide, fog: true })); m.position.set(0, 0, -0.05 * (i + 1)); dashGroup.add(m); layers.push(m); });

/* ---------------- act 3: Blockflow ---------------- */
var BF = new T.Group(); scene.add(BF);
box(46, 0.4, 30, new T.MeshStandardMaterial({ color: 0x0C1224, roughness: 0.9 }), 0, 0, 0, BF);
(function () { var e = new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(46, 0.4, 30)), new T.LineBasicMaterial({ color: 0x2D3D6E })); BF.add(e); })();
var NODES = {}, EDGES = [];
[['sales', 'Sales Actuals', 'tl', -12, 9], ['budget', 'Sales Budget', 'tl', 0, 9], ['fxr', 'FX rates', 'tl', 12, 9],
 ['prod', 'Product', 'dim', -18, 3], ['ctry', 'Country', 'dim', -6, 3], ['month', 'Month', 'dim', 6, 3], ['ver', 'Version', 'dim', 18, 3],
 ['act', 'Actual USD', 'met', -12, -3], ['bud', 'Budget USD', 'met', 0, -3], ['lc', 'Actual LC', 'met', 12, -3],
 ['trend', 'Revenue Trend', 'kpi', -12, -10], ['avb', 'Against budget', 'kpi', 0, -10], ['fx', 'FX effect', 'kpi', 12, -10]].forEach(function (n) {
  var col = { tl: C.yellow, dim: C.blue, met: C.violet, kpi: C.pink }[n[2]];
  var h = n[2] === 'kpi' ? 1.6 : 1.1, m = box(5.4, h, 2.8, glow(col, 0.22), n[3], 0.2 + h / 2, n[4], BF);
  label(n[1], null, '#F4F1EA', 5.2, n[3], 0.2 + h + 0.9, n[4], BF);
  NODES[n[0]] = { x: n[3], z: n[4], y: 0.2 + h, m: m };
});
[['sales', 'act'], ['sales', 'lc'], ['budget', 'bud'], ['fxr', 'fx'], ['prod', 'act'], ['ctry', 'act'], ['month', 'bud'], ['ver', 'bud'], ['act', 'trend'], ['act', 'avb'], ['bud', 'avb'], ['lc', 'fx'], ['act', 'fx']].forEach(function (e) {

/* ---------------- act 4: warehouse, lakehouse, sources ---------------- */
var WZ = -46;
var glass = box(20, 14, 9, new T.MeshStandardMaterial({ color: 0x57E3FF, transparent: true, opacity: 0.07, depthWrite: false, side: T.DoubleSide, roughness: 0.1, metalness: 0.2 }), 0, 7, WZ);
(function () { var e = new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(20, 14, 9)), new T.LineBasicMaterial({ color: 0x57E3FF, transparent: true, opacity: 0.8 })); e.position.set(0, 7, WZ); scene.add(e); })();
box(24, 0.4, 13, new T.MeshStandardMaterial({ color: 0x0B1020, roughness: 0.9 }), 0, 0, WZ);
var TABLES = [];
for (var li = 0; li < 4; li++) for (var k = 0; k < 3; k++) {
  var col = [C.teal, C.yellow, C.pink][k], m = box(3.4, 1, 2, glow(col, 0.12), -6.6 + li * 4.4, 1.2 + k * 2.2, WZ + 2.8 - k * 2.8);

label('Snowflake', 'the warehouse · RAW → dbt → ANALYTICS', '#DFF6FF', 12, 0, 16.5, WZ + 4.6);
var LAKE = -27;
box(12, 0.4, 10, new T.MeshStandardMaterial({ color: 0x140E0A, roughness: 0.9 }), LAKE, 0, WZ);
(function () { var e = new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(12, 8, 10)), new T.LineBasicMaterial({ color: 0xE07B39, transparent: true, opacity: 0.6 })); e.position.set(LAKE, 4, WZ); scene.add(e); })();
[['#B87333', 1.0], ['#C9CED8', 3.0], ['#E6B422', 5.0]].forEach(function (q, i) { box(8 - i * 1.4, 1.2, 6 - i, glow(q[0], 0.2), LAKE, q[1], WZ); });
label('Databricks', 'lakehouse · bronze, silver, gold', '#F6C9A8', 9, LAKE, 10.5, WZ + 3);
box(7, 0.25, 1.4, new T.MeshStandardMaterial({ color: 0x0B1020 }), -13.5, 0.15, WZ);
var SRC = [['NetSuite', 'ERP', 0, -74, '#E9DFCB'], ['Salesforce', 'CRM', -22, -70, C.blue], ['Workday', 'HR', 22, -70, C.yellow]];
SRC.forEach(function (s) {
  box(10, 0.4, 7, new T.MeshStandardMaterial({ color: 0x0B1020, roughness: 0.9 }), s[2], 0, s[3]);
  if (s[0] === 'NetSuite') for (var i = 0; i < 6; i++) box(8, 0.9, 5, glow(i % 2 ? '#C9B79A' : '#E9DFCB', 0.12), (i % 2 ? 0.3 : -0.3), 0.7 + i * 1.0, s[3]);
  else if (s[0] === 'Salesforce') [-2.6, 0, 2.6].forEach(function (o) { var c = new T.Mesh(new T.CylinderGeometry(1.1, 1.1, 3, 24), glow(C.blue, 0.2)); c.position.set(s[2] + o, 1.7, s[3]); scene.add(c); });
  else [-2.6, 0, 2.6].forEach(function (o) { for (var c = 0; c < 3; c++) { var m = box(1.8, 2.4, 0.08, glow(c % 2 ? '#FFD9A8' : C.yellow, 0.18), s[2] + o, 1.5, s[3] + c * 0.4); m.rotation.x = -0.2; } });
  label(s[0], s[1], '#F4F1EA', 8, s[2], 7.5, s[3] + 3.6);

/* ---------------- act 5: Graphite, the sparse cube ---------------- */
var GX = 46, GY = 9, GZ = 8, GN = 9, GS = 1.15, cells = [], cube;
(function () {
  var geo = new T.BoxGeometry(0.62, 0.62, 0.62), mat = new T.MeshBasicMaterial({ color: 0xffffff, fog: true });
  cube = new T.InstancedMesh(geo, mat, GN * GN * GN); var o = new T.Object3D(), seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  for (var x = 0; x < GN; x++) for (var y = 0; y < GN; y++) for (var z = 0; z < GN; z++) {
    var i = cells.length, def = rnd() < 0.16;
    o.position.set(GX + (x - 4) * GS, GY + (y - 4) * GS, GZ + (z - 4) * GS); o.scale.setScalar(def ? 1 : 0.28); o.updateMatrix(); cube.setMatrixAt(i, o.matrix);
    cells.push({ x: x, y: y, z: z, def: def, d: Math.sqrt(x * x + y * y + z * z) });
    cube.setColorAt(i, new T.Color(def ? '#7A5BE0' : '#232C4D'));
  }
  scene.add(cube);
  var e = new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(GN * GS + 0.6, GN * GS + 0.6, GN * GS + 0.6)), new T.LineBasicMaterial({ color: 0x9B7BFF, transparent: true, opacity: 0.55 })); e.position.set(GX, GY, GZ); scene.add(e);
  label('Graphite', 'the engine · only defined cells are stored', '#D9CCFF', 11, GX, GY + 8.2, GZ);
})();
var waveCol = new T.Color('#FFE08A'), defCol = new T.Color('#7A5BE0'), emptyCol = new T.Color('#232C4D'), tmpC = new T.Color();

/* ---------------- act 6: Claude, a downstream reader ---------------- */
var STAR = new T.Group(); STAR.position.set(0, 48, -38); scene.add(STAR);
for (var r = 0; r < 6; r++) { var ray = box(0.5, r % 2 ? 5.5 : 9, 0.5, glow(C.claude, 1.3), 0, 0, 0, STAR); ray.rotation.z = r * Math.PI / 6; }
(function () { var s = new T.Mesh(new T.SphereGeometry(1.1, 24, 16), glow('#FFD9C4', 1.4)); STAR.add(s); })();
label('Claude', 'a downstream reader · nothing written without approval', '#F6B79C', 13, 0, 41, -38);

/* ---------------- flows of data: motes along paths ---------------- */
var PATHS = [];
function path(pts, n, speed, col) { PATHS.push({ c: new T.CatmullRomCurve3(pts.map(function (p) { return new T.Vector3(p[0], p[1], p[2]); })), n: n, s: speed, col: new T.Color(col) }); }
path([[0, 1.5, -70], [0, 3, -60], [0, 3, -50]], 10, 0.10, '#E9DFCB');
path([[-22, 2, -66], [-12, 3, -58], [-2, 3, -50]], 10, 0.10, C.blue);
path([[22, 2, -66], [12, 3, -58], [2, 3, -50]], 10, 0.10, C.yellow);
path([[LAKE + 6, 5, WZ], [-16, 6, WZ], [-10.5, 5, WZ - 1]], 8, 0.12, '#E6B422');
path([[-6.6, 6, WZ + 4.4], [-8, 4, -28], [-12, 1.5, 12]], 14, 0.09, C.cyan);
path([[2, 6, WZ + 4.4], [3, 4, -28], [0, 1.5, 12]], 14, 0.09, C.cyan);
path([[0, 2.5, -11], [0, 14, -4], [0, DASH_Y - 7.5, 0]], 12, 0.12, C.pink);
path([[-6.6, 8, WZ], [-4, 30, -42], [0, 47, -38]], 12, 0.08, '#F4A582');
path([[0, DASH_Y + 7, 0], [0, 42, -18], [0, 47, -38]], 12, 0.08, '#F4A582');
var MOTE_N = PATHS.reduce(function (a, p) { return a + p.n; }, 0);
var motes = new T.InstancedMesh(new T.SphereGeometry(0.22, 10, 8), new T.MeshBasicMaterial({ color: 0xffffff, fog: true }), MOTE_N); scene.add(motes);
(function () { var i = 0; PATHS.forEach(function (p) { for (var j = 0; j < p.n; j++) motes.setColorAt(i++, p.col); }); })();
var pulses = new T.InstancedMesh(new T.SphereGeometry(0.2, 8, 6), new T.MeshBasicMaterial({ color: 0x57E3FF }), EDGES.length * 2); scene.add(pulses);

/* ---------------- the script: chapters and camera keys ---------------- */
var CH = [
  { t: 0, ch: 'Frame Studio', h: 'From engine to frame', p: 'A Pigment frame is a page of live numbers. This is what sits behind one.' },
  { t: 9, ch: '1 · The frame', h: 'Peel back the page', p: 'Under the dashboard: the frame’s own logic, and under that, the Pigment blocks it reads.' },
  { t: 18, ch: '2 · The model', h: 'Blockflow', p: 'Transaction lists feed metrics, metrics feed the numbers on the page. Every line is a real dependency.' },
  { t: 31, ch: '3 · The data', h: 'Where the rows come from', p: 'NetSuite, Salesforce and Workday land in a Snowflake warehouse, refined RAW to ANALYTICS, with a Databricks lakehouse beside it.' },
  { t: 45, ch: '4 · The engine', h: 'Graphite', p: 'Only defined cells are stored. Change one input and the recalculation ripples through exactly what depends on it.' },
  { t: 56, ch: '5 · The reader', h: 'And a downstream reader', p: 'Claude reads the modelled tables and the metrics, answers questions and drafts plans. Nothing is written without approval.' }
];
var KEYS = [
  [0, [0, 33, 44], [0, 30, 0]], [6, [0, 31, 25], [0, 30, 0]], [11, [20, 40, 24], [0, 26, 0]], [16, [12, 22, 22], [0, 12, 0]],
  [21, [-18, 13, 26], [0, 1, 0]], [26, [-8, 5, 10], [3, 1, -6]], [31, [10, 7, -20], [0, 5, -46]], [36, [9, 12, -30], [0, 3, -47]],
  [41, [-13, 11, -28], [-27, 3, -46]], [45, [-2, 14, -14], [20, 8, 0]], [49, [30, 15, 28], [GX, GY, GZ]], [54, [58, 11, 22], [GX, GY, GZ]],
  [58, [12, 28, 8], [0, 46, -38]], [63, [0, 74, 78], [0, 14, -22]], [68, [0, 76, 84], [0, 14, -22]]
];
var DUR = 68;
var camCurve = new T.CatmullRomCurve3(KEYS.map(function (k) { return new T.Vector3(k[1][0], k[1][1], k[1][2]); }), false, 'centripetal');
var lookCurve = new T.CatmullRomCurve3(KEYS.map(function (k) { return new T.Vector3(k[2][0], k[2][1], k[2][2]); }), false, 'centripetal');
function keyParam(t) {
  if (t <= 0) return 0; if (t >= KEYS[KEYS.length - 1][0]) return 1;
  for (var i = 0; i < KEYS.length - 1; i++) if (t < KEYS[i + 1][0]) { var u = (t - KEYS[i][0]) / (KEYS[i + 1][0] - KEYS[i][0]); u = u * u * (3 - 2 * u); return (i + u) / (KEYS.length - 1); }
  return 1;
}

/* ---------------- state: one clock drives everything, so seeking is exact ---------------- */
var S = { t: 0, playing: !reduce, free: false, last: performance.now(), chap: -1, ended: false };
var free = { th: 0.6, ph: 1.0, r: 90, target: new T.Vector3(0, 12, -18) };
var o3 = new T.Object3D(), v = new T.Vector3(), look = new T.Vector3();

function apply(t, wall) {
  /* layers peel apart between 9s and 16s */
  var peel = ease(win(t, 9, 15.5));
  layers.forEach(function (m, i) { m.position.y = -peel * 8 * (i + 1); m.material.opacity = 0.15 + 0.75 * peel; });
  dash.material.opacity = 1 - 0.25 * peel;
  /* tables light lane by lane, RAW to ANALYTICS, as the data arrives */
  TABLES.forEach(function (tb) { var on = clamp01((t - 32 - tb.k * 1.6 - tb.li * 0.5) / 1.2); tb.m.material.emissiveIntensity = 0.12 + on * (0.42 + 0.12 * Math.sin(wall * 3 + tb.li)); });
  /* Graphite: a recalculation wave from one corner from 48s */
  var wt = t - 48, ci = 0;
  cells.forEach(function (c, i) {
    var hit = wt > 0 && c.def ? Math.exp(-Math.pow(c.d - wt * 3.2, 2) / 1.4) : 0;
    tmpC.copy(c.def ? defCol : emptyCol); if (hit > 0.01) tmpC.lerp(waveCol, hit); cube.setColorAt(i, tmpC);
  });
  cube.instanceColor.needsUpdate = true;
  /* the star turns */
  STAR.rotation.z = wall * 0.25; STAR.rotation.y = Math.sin(wall * 0.4) * 0.3;
  var sp = 1 + 0.06 * Math.sin(wall * 2.2); STAR.scale.set(sp, sp, sp);
  /* motes */
  var i = 0; PATHS.forEach(function (p) { for (var j = 0; j < p.n; j++) { var u = ((wall * p.s) + j / p.n) % 1; p.c.getPoint(u, v); o3.position.copy(v); var s = Math.sin(u * Math.PI); o3.scale.setScalar(0.4 + s); o3.updateMatrix(); motes.setMatrixAt(i++, o3.matrix); } });
  motes.instanceMatrix.needsUpdate = true;
  var pi = 0; EDGES.forEach(function (c, k) { for (var j = 0; j < 2; j++) { var u = ((wall * 0.35) + k * 0.13 + j * 0.5) % 1; c.getPoint(u, v); o3.position.copy(v); o3.scale.setScalar(1); o3.updateMatrix(); pulses.setMatrixAt(pi++, o3.matrix); } });
  pulses.instanceMatrix.needsUpdate = true;
  /* camera */
  if (!S.free) {
    var q = keyParam(t); camCurve.getPoint(q, v); lookCurve.getPoint(q, look);
    v.x += Math.sin(wall * 0.3) * 0.4; v.y += Math.sin(wall * 0.23) * 0.3;
    cam.position.copy(v); cam.lookAt(look);
  } else {
    cam.position.set(free.target.x + free.r * Math.sin(free.ph) * Math.sin(free.th), free.target.y + free.r * Math.cos(free.ph), free.target.z + free.r * Math.sin(free.ph) * Math.cos(free.th));
    cam.lookAt(free.target);
  }
}

/* ---------------- captions and controls ---------------- */
var capIn = document.getElementById('capIn'), capCh = document.getElementById('capCh'), capH = document.getElementById('capH'), capP = document.getElementById('capP');
var prog = document.getElementById('prog'), playB = document.getElementById('play'), freeB = document.getElementById('free'), endEl = document.getElementById('end'), hint = document.getElementById('hint');
CH.forEach(function (c, i) { var seg = document.createElement('i'); seg.title = c.ch; seg.appendChild(document.createElement('b')); prog.appendChild(seg); });
var segs = prog.querySelectorAll('i b');
function chapterAt(t) { var k = 0; for (var i = 0; i < CH.length; i++) if (t >= CH[i].t) k = i; return k; }
function setCaption(k) {
  if (k === S.chap) return; S.chap = k; capIn.classList.add('out');
  setTimeout(function () { capCh.textContent = CH[k].ch; capH.textContent = CH[k].h; capP.textContent = CH[k].p; capIn.classList.remove('out'); }, S.t < 0.2 ? 0 : 420);
}
function paintProg() {
  for (var i = 0; i < CH.length; i++) { var a = CH[i].t, b = i + 1 < CH.length ? CH[i + 1].t : DUR; segs[i].style.width = (clamp01((S.t - a) / (b - a)) * 100) + '%'; }
  prog.setAttribute('aria-valuenow', String(Math.round(S.t / DUR * 100)));
}
function setPlaying(p) { S.playing = p; playB.textContent = p ? 'Pause' : 'Play'; playB.setAttribute('aria-label', p ? 'Pause' : 'Play'); if (p && S.t >= DUR) seek(0); }
function seek(t) { S.t = Math.max(0, Math.min(DUR, t)); S.ended = false; endEl.classList.remove('on'); if (S.free) setFree(false); }
function setFree(on) {
  S.free = on; freeB.textContent = on ? 'Resume the tour' : 'Take the controls'; hint.classList.toggle('on', on);
  if (on) { var d = cam.position.clone().sub(free.target); free.r = d.length(); free.ph = Math.acos(d.y / free.r); free.th = Math.atan2(d.x, d.z); setTimeout(function () { hint.classList.remove('on'); }, 3200); }
}
playB.addEventListener('click', function () { setPlaying(!S.playing); });
freeB.addEventListener('click', function () { setFree(!S.free); if (!S.free) setPlaying(true); });
document.getElementById('again').addEventListener('click', function () { seek(0); setPlaying(true); });
document.getElementById('full').addEventListener('click', function () { var d = document.documentElement; if (document.fullscreenElement) document.exitFullscreen(); else if (d.requestFullscreen) d.requestFullscreen().catch(function () {}); });
prog.addEventListener('click', function (e) { var r = prog.getBoundingClientRect(), f = (e.clientX - r.left) / r.width, i = Math.min(CH.length - 1, Math.floor(f * CH.length)); seek(CH[i].t + 0.01); setPlaying(true); });
prog.addEventListener('keydown', function (e) { var k = chapterAt(S.t); if (e.key === 'ArrowRight') { seek(CH[Math.min(CH.length - 1, k + 1)].t + 0.01); e.preventDefault(); } if (e.key === 'ArrowLeft') { seek(CH[Math.max(0, k - 1)].t + 0.01); e.preventDefault(); } });
document.addEventListener('keydown', function (e) { if (e.key === ' ' && e.target === document.body) { setPlaying(!S.playing); e.preventDefault(); } });
/* links on the end card open the app in the site when embedded, or the site itself when standalone */
Array.prototype.forEach.call(document.querySelectorAll('[data-view]'), function (a) {
  a.addEventListener('click', function (e) { try { var P = window.parent; if (P !== window && P.__atlas && P.__atlas.show) { e.preventDefault(); P.__atlas.show(a.getAttribute('data-view')); } } catch (x) {} });
});
/* free look: drag to orbit, wheel to zoom */
var drag = null;
renderer.domElement.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY }; if (!S.free) setFree(true); renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove', function (e) { if (!drag) return; free.th -= (e.clientX - drag.x) * 0.005; free.ph = Math.max(0.15, Math.min(1.5, free.ph - (e.clientY - drag.y) * 0.004)); drag = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', function () { drag = null; });
renderer.domElement.addEventListener('wheel', function (e) { if (!S.free) setFree(true); free.r = Math.max(12, Math.min(220, free.r * (1 + e.deltaY * 0.001))); e.preventDefault(); }, { passive: false });

/* ---------------- size and loop ---------------- */
function resize() {
  var w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h); cam.aspect = w / h; cam.fov = w < h ? 68 : 50; cam.updateProjectionMatrix();
  if (composer) { composer.setSize(w, h); bloom.resolution.set(w / 2, h / 2); }
}
window.addEventListener('resize', resize); resize();
var visible = true;
try { new IntersectionObserver(function (es) { visible = es[0].isIntersecting; }).observe(document.body); } catch (e) {}
document.addEventListener('visibilitychange', function () { S.last = performance.now(); });
if (reduce) { S.t = 63; }
setCaption(chapterAt(S.t));
function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.min(0.1, (now - S.last) / 1000); S.last = now;
  if (!visible || document.hidden) return;
  if (S.playing && !S.free) { S.t += dt; if (S.t >= DUR) { S.t = DUR; S.playing = false; playB.textContent = 'Play'; if (!S.ended) { S.ended = true; endEl.classList.add('on'); } } }
  setCaption(chapterAt(S.t)); paintProg();
  apply(S.t, reduce ? 0 : now / 1000);
  if (composer) composer.render(); else renderer.render(scene, cam);
}
requestAnimationFrame(frame);
})();
</script>
</body>
