   Synthetic and deterministic, shaped exactly like the frame's six Pigment data sources
   (see frames/ji-sandbox/palette/frame.json):
     dsTrend   labels [Version, Month]            values [Net Revenue USD]        filter lCountry
     dsAvb     labels [Month]                     values [Actual, Budget]         filter lCountry
     dsChannel labels [Channel, Month]            values [Net Revenue USD]
     dsAge     labels [Product, Months Since Launch] values [Net Revenue USD]
     dsFx      labels [Country]                   values [Net Revenue USD, FX Impact USD]
     dsPvm     labels [Month]                     values [Price, Volume, Mix Effect USD]  (added by the price/volume/mix build)
     dsConfig  labels [Frame Setting]             values [text]   (written by editValue on mConfig) */
(function () {
  'use strict';
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var lbl = function (k) { return MON[k % 12] + ' ' + String(Math.floor(k / 12)).slice(2); };
  var K = function (y, m) { return y * 12 + m; };
  var ACT0 = K(2024, 0), ACTN = K(2026, 5), BUD0 = K(2025, 0), BUDN = K(2026, 11);

  // country weights (share of revenue) and FX sensitivity
  var COUNTRY = {
    'United States': [0.34, -0.004], 'Canada': [0.05, -0.012], 'Brazil': [0.035, -0.06], 'Mexico': [0.025, 0.02],
    'Australia': [0.03, -0.03], 'Hong Kong': [0.015, 0.0], 'Japan': [0.06, -0.08], 'South Korea': [0.025, -0.04], 'New Zealand': [0.008, -0.03], 'Singapore': [0.012, 0.01],
    'United Arab Emirates': [0.01, 0.0], 'Austria': [0.01, 0.015], 'Switzerland': [0.02, 0.03], 'Germany': [0.08, 0.015], 'Spain': [0.03, 0.015], 'France': [0.06, 0.015],
    'United Kingdom': [0.07, 0.025], 'Ireland': [0.01, 0.015], 'Italy': [0.03, 0.015], 'Netherlands': [0.02, 0.015], 'Norway': [0.008, -0.02], 'Poland': [0.012, 0.01],
    'Sweden': [0.012, -0.015], 'South Africa': [0.006, -0.05]
  };
  var CHANNELS = { 'Direct': 0.34, 'Marketplace': 0.24, 'Retail - Specialist': 0.17, 'Retail - General': 0.15, 'B2B Direct': 0.10 };
  var PRODUCTS = {
    'Lumina Band Lite Gen 1': [1.0, 0.0], 'Lumina Band Lite 2': [1.25, 0.6],
    'Lumina Buds Pro': [1.6, 0.1], 'Lumina Buds Pro ANC': [1.9, 0.5],
    'Lumina Watch SE Gen 1': [2.2, 0.2], 'Lumina Watch SE Gen 2': [2.5, 0.4]
  };

  // total monthly net revenue: growth + seasonality + a little deterministic noise
  function noise(k) { var x = Math.sin(k * 12.9898) * 43758.5453; return (x - Math.floor(x)) - 0.5; }
  function seasonal(k) { var m = k % 12; return 1 + 0.22 * Math.exp(-Math.pow(m - 10.5, 2) / 2) + 0.06 * Math.sin((m + 1) / 12 * Math.PI * 2); }
  function actual(k) { return 38e6 * Math.pow(1.012, k - ACT0) * seasonal(k) * (1 + 0.05 * noise(k)); }
  function budget(k) { return 38e6 * Math.pow(1.0135, k - ACT0) * seasonal(k) * 1.02; }

  // regions grow at different speeds against one budget, so regional cuts and the bridge differ
  var TILT = { NAM: 0.05, LATAM: 0.16, EMEA: -0.14, APAC: 0.03 };
  var REGION_OF = {};
  [['NAM', ['Canada', 'United States']], ['LATAM', ['Brazil', 'Mexico']], ['APAC', ['Australia', 'Hong Kong', 'Japan', 'South Korea', 'New Zealand', 'Singapore']],
   ['EMEA', ['United Arab Emirates', 'Austria', 'Switzerland', 'Germany', 'Spain', 'France', 'United Kingdom', 'Ireland', 'Italy', 'Netherlands', 'Norway', 'Poland', 'Sweden', 'South Africa']]]
    .forEach(function (r) { r[1].forEach(function (c) { REGION_OF[c] = r[0]; }); });
  function selected(filters) {
    var f = (filters || []).filter(function (x) { return x.binding === 'lCountry'; })[0];
    return (!f || !f.selection || !f.selection.length) ? Object.keys(COUNTRY) : f.selection;
  }
  function act(k, filters) {
    var t = (k - ACT0) / (ACTN - ACT0);
    return selected(filters).reduce(function (s, c) { return s + ((COUNTRY[c] || [0])[0]) * actual(k) * (1 + (TILT[REGION_OF[c]] || 0) * t); }, 0);
  }
  function bud(k, filters) { return selected(filters).reduce(function (s, c) { return s + ((COUNTRY[c] || [0])[0]); }, 0) * budget(k); }

    dsTrend: function (filters) {
      var rows = [], k;
      for (k = ACT0; k <= ACTN; k++) rows.push({ labels: ['Actual', lbl(k)], values: [act(k, filters)] });
      for (k = BUD0; k <= BUDN; k++) rows.push({ labels: ['Budget', lbl(k)], values: [bud(k, filters)] });
      return rows;
    },
    dsAvb: function (filters) {
      var rows = [];
      for (var k = BUD0; k <= ACTN; k++) rows.push({ labels: [lbl(k)], values: [act(k, filters), bud(k, filters)] });
      return rows;
    },
    // price, volume and mix by month, company-wide; the three add up to actual minus budget
    dsPvm: function () {
      var rows = [];
      for (var k = BUD0; k <= ACTN; k++) {
        var gap = act(k) - bud(k), b = bud(k), vol = gap * 0.92 + b * 0.008 * noise(k * 5), prc = -b * 0.005 * (1.2 + noise(k * 3)), mix = gap - vol - prc;
        rows.push({ labels: [lbl(k)], values: [prc, vol, mix] });
      }
      return rows;
    },
    dsChannel: function () {
      var rows = [];
      for (var k = ACT0; k <= ACTN; k++) {
        var drift = (k - ACT0) / (ACTN - ACT0); // Direct and Marketplace gain share over time
        Object.keys(CHANNELS).forEach(function (c, i) {
          var w = CHANNELS[c] * (i < 2 ? 1 + 0.25 * drift : 1 - 0.2 * drift) * (1 + 0.04 * noise(k * 7 + i));
          rows.push({ labels: [c, lbl(k)], values: [actual(k) * w] });
        });
      }
      return rows;
    },
    dsAge: function () {
      var rows = [];
      Object.keys(PRODUCTS).forEach(function (p, i) {
        var scale = PRODUCTS[p][0] * 1.8e6, lift = PRODUCTS[p][1];
        for (var n = 0; n <= 24; n++) {
          var curve = (1 - Math.exp(-(n + 1) / (2.2 - lift))) * Math.exp(-n / 30) * (1 + 0.05 * noise(n * 3 + i));
          rows.push({ labels: [p, 'M' + (n < 10 ? '0' : '') + n], values: [scale * curve] });
        }
      });
      return rows;
    },
    dsFx: function () {
      var since = 0; for (var k = BUD0; k <= ACTN; k++) since += actual(k);
      return Object.keys(COUNTRY).map(function (c) { var w = COUNTRY[c]; return { labels: [c], values: [since * w[0], since * w[0] * w[1]] }; });
    },
    dsConfig: function (filters, store) {
      var out = [];
      Object.keys(store.config || {}).forEach(function (key) {
        var parts = key.split('|'); if (parts[0] !== 'mConfig') return;
        var co = {}; try { co = JSON.parse(parts[1]); } catch (e) {}
        if (co.lSetting) out.push({ labels: [co.lSetting], values: [String(store.config[key])] });
      });
      return out;
    }
  };
})();
</script><script>/* Mock PigmentSDK for local frame previews.
   Runs inside the same kind of sandbox Pigment uses (iframe, allow-scripts only, opaque origin).
   Data comes from window.__FRAME_FIXTURES[name](dynamicFilters) -> rows [{labels, values}].
   Writes (editValue, addItem, editItem) are kept in memory, echoed to subscribers, and reported
   to the preview page with postMessage so it can log them and remember saved settings. */
(function () {
  'use strict';
  var FIX = window.__FRAME_FIXTURES || {};
  var cfg = window.__DEV_CONFIG || {};        // metric writes, keyed "metric|coordJSON"
  var items = {};                             // list binding -> [props]
  var subs = [], itemSubs = [];
  function pushItems(s) { if (!s.live) return; var it = (items[s.list] || []).map(function (p) { return p.Name || p.name || JSON.stringify(p); }); try { s.handlers.onData({ items: it, partialResult: false }); } catch (e) {} }
  var LATENCY = 180;

  function report(msg) { try { window.parent.postMessage(Object.assign({ source: 'pigment-sdk-mock' }, msg), '*'); } catch (e) {} }
  function rowsFor(name, filters) {
    var f = FIX[name];
    if (!f) throw new Error('No data source named "' + name + '" in this preview');
    return f(filters || [], { config: cfg, items: items });
  }
  function push(sub) {
    if (!sub.live) return;
    try { sub.handlers.onData({ rows: rowsFor(sub.name, sub.filters) }); }
    catch (e) { if (sub.handlers.onError) sub.handlers.onError(e); }
  }
  function refreshAll() { subs.forEach(function (s) { setTimeout(function () { push(s); }, LATENCY / 2); }); }

  window.PigmentSDK = {
    __mock: true,
    subscribeToDataSource: function (name, handlers) {
      var sub = { name: name, handlers: handlers || {}, filters: (handlers && handlers.dynamicFilters) || [], live: true };
      subs.push(sub);
      report({ type: 'subscribe', name: name, filters: sub.filters });
      setTimeout(function () { push(sub); }, LATENCY);
      return {
        unsubscribe: function () { sub.live = false; },
        updateDynamicFilters: function (f) { sub.filters = f || []; report({ type: 'filter', name: name, filters: sub.filters }); setTimeout(function () { push(sub); }, LATENCY / 2); }
      };
    },
    editValue: function (metric, coords, value) {
      cfg[metric + '|' + JSON.stringify(coords)] = value;
      report({ type: 'editValue', metric: metric, coords: coords, value: value, config: cfg });
      refreshAll();
      return new Promise(function (res) { setTimeout(res, LATENCY); });
    },
    subscribeToItems: function (list, handlers) {
      var s = { list: list, handlers: handlers || {}, live: true }; itemSubs.push(s);
      setTimeout(function () { pushItems(s); }, LATENCY);
      return { unsubscribe: function () { s.live = false; } };
    },
    addItem: function (list, props) {
      (items[list] = items[list] || []).push(props);
      itemSubs.forEach(function (s) { if (s.list === list) setTimeout(function () { pushItems(s); }, LATENCY / 2); });
      report({ type: 'addItem', list: list, props: props });
      refreshAll();
      return new Promise(function (res) { setTimeout(res, LATENCY); });
    },
    editItem: function (list, id, props) {
      report({ type: 'editItem', list: list, id: id, props: props });
      return new Promise(function (res) { setTimeout(res, LATENCY); });
    }
  };
})();
