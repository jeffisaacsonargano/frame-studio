<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>/* Pigment Atlas: inherit the host page's runtime when embedded */(function(){try{if(window.parent!==window&&!("claude" in window)){Object.defineProperty(window,"claude",{configurable:true,get:function(){return window.parent.claude}})}}catch(e){}})();</script>
<title>Framecraft</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="strata.css">

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 3 25 9 14 15 3 9z" fill="var(--accent)" opacity=".95"/><path d="M3 13.5 14 19.5 25 13.5" fill="none" stroke="var(--c-logic)" stroke-width="2"/><path d="M3 18 14 24 25 18" fill="none" stroke="var(--c-list)" stroke-width="2"/></svg>
      <div class="brand-text"><span class="brand-name">Framecraft</span><span class="brand-sub">Lineage explorer for Pigment Frames</span></div>
    </div>
    <button class="picker" id="picker" type="button" aria-haspopup="true">
      <span class="picker-name" id="pickerName">Loading…</span>
      <span class="picker-meta" id="pickerMeta"></span>
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4 6 4 4 4-4"/></svg>
    </button>
    <nav class="seg" id="viewTabs" aria-label="View">
      <button type="button" data-view="frame">Frame</button>
      <button type="button" data-view="layers">Layers 3D</button>
      <button type="button" data-view="trace">Trace 2D</button>
      <button type="button" data-view="compare">Compare</button>
    </nav>
    <div class="top-actions">
      <nav class="seg theme-seg" id="themeSeg" aria-label="Theme">
        <button type="button" data-theme-set="light" title="Light" aria-label="Light theme"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9 13 13M3 13l1.1-1.1M11.9 4.1 13 3"/></svg></button>
        <button type="button" data-theme-set="dark" title="Dark" aria-label="Dark theme"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 9.6A5.8 5.8 0 0 1 6.4 2.5a5.8 5.8 0 1 0 7.1 7.1z"/></svg></button>
      </nav>
      <button class="btn btn-walk" id="btnWalkFrame" type="button" title="Walk the Frame: dive into Frame World in first person" onclick="try{var c=window.parent!==window?window.parent.__canvas:null;if(c&&c.open)c.open('frame-world',{from:'Framecraft'});else location.href='../frame-world.html';}catch(e){location.href='../frame-world.html';}"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="2.6" r="1.3"/><path d="M8.6 5 6.8 8.4l2.4 1.6-.8 3.8M6.8 8.4 5 7.6 4 9.4M9.2 10l2.4 1.2"/></svg>Walk the Frame</button>
      <button class="btn btn-studio" id="btnStudio" type="button" aria-haspopup="true" title="Studio: gallery, flipbook, journey and other playful views"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1.5 9.6 6.4 14.5 8 9.6 9.6 8 14.5 6.4 9.6 1.5 8 6.4 6.4z"/></svg>Studio</button>
      <button class="btn btn-toggle" id="btnSelfEdit" type="button" aria-pressed="false" title="Put an edit pane inside the frame">Edit in frame</button>
      <button class="btn" id="btnHistory" type="button">History</button>
      <button class="btn" id="btnLoad" type="button">Load frame</button>
      <button class="btn btn-icon" id="btnPane" type="button" aria-label="Toggle side pane" title="Toggle side pane"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M10 2.5v11"/></svg></button>
    </div>
  </header>

  <div class="workspace" id="workspace">
    <main class="stage" id="stage" data-mode="frame">
      <div class="stage-bg" aria-hidden="true"></div>
      <div class="viewport" id="viewport">
        <div class="scene" id="scene">
          <div class="plane plane-floor" aria-hidden="true"></div>
          <div class="plane layer" data-layer="upstream"><div class="plane-tag"></div><div class="nodes"></div></div>
          <div class="plane layer" data-layer="flow"><div class="plane-tag"></div><div class="flowmap"></div></div>
          <div class="plane layer" data-layer="blocks"><div class="plane-tag"></div><div class="nodes"></div></div>
          <div class="plane layer" data-layer="logic"><div class="plane-tag"></div><div class="nodes"></div></div>
          <div class="plane layer" data-layer="frame"><div class="plane-tag"></div><div class="frame-host" id="frameHost"></div><div class="hotspots" id="hotspots"></div></div>
        </div>
      </div>
      <div class="trace2d" id="trace2d"></div>
      <canvas class="traces" id="traces"></canvas>

      <div class="stage-summary" id="summary"></div>
      <div class="frame-status" id="frameStatus" hidden></div>

      <section class="dock float" id="dock" data-corner="bl">
        <header class="float-head"><button class="mini dock-flip" type="button" id="dockFlip" aria-pressed="false" aria-label="Reveal source layers" title="Reveal source layers"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 2 14 5 8 8 2 5z"/><path class="df-l2" d="M2 8l6 3 6-3"/><path class="df-l3" d="M2 11l6 3 6-3"/></svg></button><span class="float-title" id="dockTitle">Layers</span><button class="mini" type="button" data-collapse="dock" aria-label="Collapse controls">–</button></header>
        <div class="float-body" id="dockBody"></div>
      </section>

      <section class="legend float" id="legend" data-corner="br">
        <header class="float-head"><span class="float-title">Key</span><button class="mini" type="button" data-collapse="legend" aria-label="Collapse key">–</button></header>
        <div class="float-body">
          <ul class="key">
            <li><i style="--k:var(--c-metric)"></i>Metric value</li>
            <li><i style="--k:var(--c-list)"></i>Dimension item</li>
            <li><i style="--k:var(--c-logic)"></i>Computed in frame</li>
            <li><i style="--k:var(--c-const)"></i>Hardcoded in code</li>
            <li><i style="--k:var(--c-axis)"></i>Chart scale</li>
            <li><i class="is-dashed" style="--k:var(--c-untraced)"></i>Not traced</li>
            <li><i style="--k:var(--c-upstream)"></i>Upstream lineage</li>
          </ul>
        </div>
      </section>

      <div class="tip" id="tip" hidden></div>
      <div class="compare" id="compare" hidden></div>
    </main>

    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize side pane" tabindex="0"><span></span></div>

    <aside class="pane" id="pane">
      <nav class="pane-tabs" id="paneTabs">
        <button type="button" data-tab="inspect">Inspect</button>
        <button type="button" data-tab="tune">Tune</button>
        <button type="button" data-tab="claude">Ask Claude</button>
        <button type="button" data-tab="code">Code</button>
      </nav>
      <div class="pane-body">
        <section class="tab" data-tab="inspect" id="tabInspect"></section>
        <section class="tab" data-tab="tune" id="tabTune" hidden></section>
        <section class="tab" data-tab="claude" id="tabClaude" hidden></section>
        <section class="tab" data-tab="code" id="tabCode" hidden></section>
      </div>
    </aside>
  </div>

  <div class="pop" id="pickerPop" hidden></div>
  <div class="pop pop-right" id="historyPop" hidden></div>
  <div class="pop studio-pop" id="studioPop" hidden></div>
  <div class="modal" id="loadModal" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<script src="js/engine.js"></script>
<script src="js/runtime.js"></script>
<script src="js/demo.js"></script>
<script src="js/view.js"></script>
<script src="js/flowmap.js"></script>
<script src="js/selfedit.js"></script>
<script src="js/samples.js"></script>
<script src="js/explain.js"></script>
<script src="js/alt.js"></script>
<script src="js/walk.js"></script>
<script src="js/play.js"></script>
<script src="js/app.js"></script>

</body></html>
