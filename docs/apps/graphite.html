<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Graphite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Graphite: a 3D explainer for Pigment's calculation engine. Canvas stage on the left, explanation panel on the right.
   Tokens mirror the Frame Studio shell so the app follows the shell's light/dark switch (data-theme on <html>). */
:root {
  --bg: #F0EBE1; --surface: #FBF8F3; --sunk: #E8E1D4; --raise: #FDFBF7;
  --ink: #1F1E1D; --ink-2: #3D3A35; --muted: #655F55; --faint: #857E72;
  --line: #DCD4C5; --line-soft: #E9E2D6;
  --accent: #B04F2B; --accent-ink: #FFFDF9; --accent-soft: #F2DDD0; --accent-deep: #8F3F22;
  --ok: #2F6B3F; --warn: #8A5600; --bad: #A8322B;
  --c-input: #3A7049; --c-calc: #B04F2B; --c-lost: #8F5A06; --c-idle: #C4BBAB; --c-zero: #A39A8A;
  --stage: #ECE6DA;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #1F1E1D; --surface: #262624; --sunk: #30302E; --raise: #2A2927;
  --ink: #FAF9F5; --ink-2: #E5E3DA; --muted: #B5B3A9; --faint: #8A887F;
  --line: rgba(250,249,245,.12); --line-soft: rgba(250,249,245,.07);
  --accent: #D97757; --accent-ink: #1F1E1D; --accent-soft: rgba(217,119,87,.18); --accent-deep: #EBA487;
  --ok: #8FC6A0; --warn: #E5B567; --bad: #E58F86;
  --c-input: #8FC6A0; --c-calc: #D97757; --c-lost: #E5B567; --c-idle: #55534E; --c-zero: #77756D;
  --stage: #191817;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
a { color: var(--accent-deep); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
code, .mono { font-family: var(--f-mono); font-size: .9em; }

.app { display: grid; grid-template-rows: auto minmax(0,1fr); height: 100%; }
.top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
/* Inside Frame Studio the shell's app bar already names the app. */
.in-canvas .top .name { display: none; }
.top .name { display: flex; flex-direction: column; line-height: 1.15; flex: none; }
.top .name b { font-family: var(--f-display); font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
.top .name span { font-size: 11.5px; color: var(--muted); }
.tabs { display: flex; gap: 2px; background: var(--sunk); border-radius: 9px; padding: 3px; overflow-x: auto; min-width: 0; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: transparent; padding: 5px 11px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.work { display: grid; grid-template-columns: minmax(0,1fr) 372px; min-height: 0; }
.stage { position: relative; min-width: 0; min-height: 0; background: var(--stage); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage canvas:focus-visible { outline-offset: -3px; }
.hud { position: absolute; left: 12px; top: 12px; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; max-width: calc(100% - 24px); }
.pill { background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 4px 11px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill b { font-weight: 600; color: var(--ink); }
.pill.warn b { color: var(--warn); }
.hint { position: absolute; left: 12px; right: 124px; bottom: 10px; font-size: 11.5px; color: var(--faint); pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; }
.zoom button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; line-height: 1; }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

.panel { background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto; padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.panel h2 { font-size: 19px; font-weight: 650; line-height: 1.2; }
.panel p { margin: 0; color: var(--ink-2); }
.eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.sec-t { font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
.ctl { display: flex; flex-wrap: wrap; gap: 6px; }
.chipb { border: 1px solid var(--line); background: var(--raise); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; font-weight: 500; }
.chipb:hover { border-color: var(--faint); }
.chipb[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-deep); }
.chipb.mono { font-family: var(--f-mono); font-size: 12px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-weight: 500; font-size: 13px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.link { border-color: transparent; background: transparent; color: var(--accent-deep); padding-inline: 2px; }
.fx { font-family: var(--f-mono); font-size: 12px; background: var(--sunk); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: pre; color: var(--ink-2); }
.info { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--raise); }
.info h3 { font-size: 15.5px; font-weight: 650; }
.info p, .info li { font-size: 13px; color: var(--ink-2); }
.info ul { margin: 0; padding-left: 18px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; align-self: flex-start; }
.tag.doc { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.tag.inf { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.tag.ill { background: var(--sunk); color: var(--muted); }
.srcs { font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.stat b { display: block; font-family: var(--f-display); font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat span { font-size: 11px; color: var(--muted); }
.stat.hot b { color: var(--warn); }
.rows { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; }
.rows button { display: flex; justify-content: space-between; gap: 8px; text-align: left; border: 0; background: transparent; padding: 4px 6px; border-radius: 6px; }
.rows button:hover { background: var(--sunk); }
.rows .n { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.rows .lost .n { color: var(--warn); font-weight: 600; }
.rows .idle { color: var(--faint); }
details { border-top: 1px solid var(--line); padding-top: 10px; }
summary { font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.els { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.els button { border: 1px solid var(--line-soft); background: transparent; border-radius: 6px; padding: 2px 8px; font-size: 12px; color: var(--ink-2); }
.srclist { margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--ink-2); display: flex; flex-direction: column; gap: 6px; }
.srclist small { display: block; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.note { font-size: 12px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; margin: 0; }

@media (max-width: 860px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .work { grid-template-columns: minmax(0,1fr); }
  .stage { height: 56vh; min-height: 320px; }
  .panel { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .top { flex-wrap: wrap; gap: 8px; padding: 10px 16px; }
  .tabs { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="name"><b>Graphite</b><span>Inside Pigment's calculation engine</span></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Scenes"></div>
  </header>
  <div class="work">
    <main class="stage" id="stage">
      <canvas id="cv" tabindex="0" aria-label="3D scene. Drag to orbit, scroll to zoom, arrow keys to rotate, plus and minus to zoom. Every element is also listed in the panel."></canvas>
      <div class="hud" id="hud" aria-live="polite"></div>
      <div class="hint" id="hint">Drag to orbit · scroll to zoom · click anything to explain it</div>
      <div class="zoom"><button type="button" data-zoom="1.2" aria-label="Zoom out">−</button><button type="button" data-zoom="0.83" aria-label="Zoom in">+</button><button type="button" data-zoom="0" aria-label="Reset view" title="Reset view">⟲</button></div>
      <div class="fallback" id="fallback" hidden>The 3D library could not be loaded, so the scene is unavailable. The explanations and sources in the panel still work.</div>
    </main>
    <aside class="panel" id="panel" aria-label="Explanation"></aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Deep-link contract (any of these focus a scene, and for the sparse-cube scene a modifier):
     1. Canvas bridge:   window.parent.__canvas.open('graphite', { scene: 'cube', modifier: 'BY' })
                         -> the shell calls this page's window.__canvasReceive({ target: 'graphite', payload })
     2. postMessage:     graphiteWindow.postMessage({ type: 'graphite:focus', scene: 'cube', modifier: 'REMOVE' }, '*')
     3. URL hash:        apps/graphite.html#cube/BY   or   #scene=recalc   or   #modifier=FILTER
   Formula Studio sends payload { from: 'Formula Studio', focus: { modifier, method, op, code, block, formula,
     before: { dims, sizes, dense, defined }, after: { dims, sizes, dense, defined }, illustrative: true } }.
     Graphite then opens the sparse cube on that modifier, shows the formula and the real before/after cell counts,
     and offers a way back (window.parent.__canvas.open('formula-lens')). KEEP is shown with REMOVE, EXCLUDE with FILTER.
   scene: overview | cube | recalc | pipeline | access | scenarios.   modifier: BY | REMOVE | ADD | SELECT | FILTER | DENSIFY | NONE. */
(function () {
  'use strict';
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  /* ------------------------------------------------------------ sources */
  const SRC = {
    news: { t: 'Pigment newsroom: Series E announcement (Graphite named)', u: 'https://www.pigment.com/newsroom/pigment-raises-250m-series-e', n: 'Graphite as the proprietary, patent-pending compute engine; scale and concurrency claims.' },
    pilotia: { t: 'Pilotia: Pigment unveils Graphite (secondary coverage)', u: 'https://www.pilotia.com/en/pigment-devoile-graphite-le-moteur-technologique-de-sa-plateforme-de-planification/', n: 'Three pillars: elastic engine with storage separated from compute, unified governed data, dynamic modeling.' },
    arch: { t: 'Pigment Community: Architectural foundations: dimensions, sparsity, scale and the discipline of scope', u: 'https://community.pigment.com/technical-tips-182/architectural-foundations-dimensions-sparsity-scale-and-the-discipline-of-scope-3973', n: 'Sparse engine, cardinality, densifying functions, dependency graph, parallelised calculation, scope.' },
    sparse: { t: 'Pigment Community: Sparse engine concept', u: 'https://community.pigment.com/questions-conversations-40/sparse-engine-concept-1886', n: 'Pigment staff on blanks being skipped, and why cells still count.' },
    scope: { t: 'Pigment KB: Optimize formulas with scoped calculations', u: 'https://kb.pigment.com/docs/optimize-formulas-scoped-calculations', n: 'What scope is, how it passes down a calculation path, and which functions lose it.' },
    hints: { t: 'Pigment KB: Performance improvement hints', u: 'https://kb.pigment.com/docs/performance-hints', n: 'ADD, ADD then FILTER, IF with a constant, ISBLANK and ISDEFINED and their effect on density.' },
    prof: { t: 'Pigment KB: Use profiling to optimize calculation paths', u: 'https://kb.pigment.com/docs/profile-calculation-paths', n: 'The profiler, the Scope column and rows computed.' },
    ar: { t: 'Pigment KB: Introduction to Access Rights', u: 'https://kb.pigment.com/docs/introduction-access-rights', n: 'Role defaults, rules, most restrictive wins.' },
    arm: { t: 'Pigment KB: About Access Rights Metrics and Rules', u: 'https://kb.pigment.com/docs/access-rights-metrics-rules', n: 'Read/Write values, blank treated as restrictive.' },
    scn: { t: 'Pigment KB: Get started with Scenarios', u: 'https://kb.pigment.com/docs/get-started-scenarios', n: 'Default Scenario inherits existing inputs and formulas; new scenarios start from a source scenario.' },
    scnCopy: { t: 'Pigment KB: Copy inputs between Scenarios', u: 'https://kb.pigment.com/docs/copy-inputs-between-scenarios', n: 'Copying overrides, manual inputs and imported data to a target scenario.' },
    scnComm: { t: 'Pigment Community: using a scenario as an overlay to the default', u: 'https://community.pigment.com/questions-conversations-40/is-it-possible-to-use-scenario-s-as-an-overlay-to-the-default-scenario-3435', n: 'User reports that scenarios behave as separate layers.' },
  };
  const TAGS = { doc: 'Documented', inf: 'Inferred', ill: 'Illustrative' };
  function srcLinks(ids) { return (ids || []).map((id) => SRC[id] ? '<a href="' + SRC[id].u + '" target="_blank" rel="noopener">' + esc(SRC[id].t.split(':')[0]) + ' ↗</a>' : '').join(''); }
  function infoHtml(i) {
    if (!i) return '';
    return '<div class="info"><span class="tag ' + i.tag + '">' + TAGS[i.tag] + '</span><h3>' + esc(i.title) + '</h3>' + i.body +
      (i.src && i.src.length ? '<div class="srcs">' + srcLinks(i.src) + '</div>' : '') +
      (i.act ? '<div><button type="button" class="btn link" data-act="' + esc(i.act[0]) + '">' + esc(i.act[1]) + ' →</button></div>' : '') + '</div>';
  }

  /* ------------------------------------------------------------ three.js stage */
  const T = window.THREE;
  const cv = $('#cv'), stage = $('#stage');
  const G = { ok: !!T, picks: [], tweens: [], timers: [], orbit: { th: 0.7, ph: 1.05, r: 16, tx: 0, ty: 0, tz: 0 }, home: null, group: null, token: 0 };
  let renderer, scene3, camera, ray, amb, sun;
  if (G.ok) {
    try {
      renderer = new T.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
      scene3 = new T.Scene();
      camera = new T.PerspectiveCamera(42, 1, 0.1, 400);
      ray = new T.Raycaster();
      amb = new T.AmbientLight(0xffffff, 0.75); scene3.add(amb);
      sun = new T.DirectionalLight(0xffffff, 0.65); sun.position.set(6, 12, 8); scene3.add(sun);
    } catch (e) { G.ok = false; }
  }
  if (!G.ok) { $('#fallback').hidden = false; $('#hint').hidden = true; }

  const col = (n) => new T.Color(css(n) || '#888');
  function resize() {
    if (!G.ok) return;
    const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  function placeCam() {
    const o = G.orbit;
    o.ph = Math.max(0.12, Math.min(Math.PI - 0.12, o.ph)); o.r = Math.max(4, Math.min(80, o.r));
    camera.position.set(o.tx + o.r * Math.sin(o.ph) * Math.sin(o.th), o.ty + o.r * Math.cos(o.ph), o.tz + o.r * Math.sin(o.ph) * Math.cos(o.th));
    camera.lookAt(o.tx, o.ty, o.tz);
  }
  const ease = (k) => k * k * (3 - 2 * k);
  function tw(ms, fn, done) { const t = { t0: performance.now(), ms: reduce ? 1 : ms, fn, done, tok: G.token }; G.tweens.push(t); return t; }
  function later(fn, ms) { const tok = G.token; const id = setTimeout(() => { if (tok === G.token) fn(); }, reduce ? Math.min(ms, 30) : ms); G.timers.push(id); }
  function camTo(to, ms) {
    const o = G.orbit, from = Object.assign({}, o);
    tw(ms || 700, (k) => { Object.keys(to).forEach((p) => { o[p] = from[p] + (to[p] - from[p]) * k; }); });
  }
  function loop(now) {
    requestAnimationFrame(loop);
    if (!G.ok || document.hidden) return;
    for (let i = G.tweens.length - 1; i >= 0; i--) {
      const t = G.tweens[i];
      if (t.tok !== G.token) { G.tweens.splice(i, 1); continue; }
      const k = Math.min(1, (now - t.t0) / t.ms);
      if (k < 0) continue;
      t.fn(ease(k));
      if (k >= 1) { G.tweens.splice(i, 1); if (t.done) t.done(); }
    }
    if (G.spin && !reduce && !G.dragging) G.orbit.th += 0.0012;
    placeCam();
    renderer.render(scene3, camera);
  }
  function clearScene() {
    G.token++; G.tweens.length = 0; G.timers.forEach(clearTimeout); G.timers.length = 0; G.picks = [];
    if (G.group) {
      scene3.remove(G.group);
      G.group.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
    }
    G.group = new T.Group(); scene3.add(G.group);
  }
  /* text sprite */
  function label(text, o) {
    o = o || {};
    const fs = o.size || 26, pad = o.bg ? 12 : 4;
    const c = document.createElement('canvas'), x = c.getContext('2d');
    const font = (o.weight || 500) + ' ' + fs + 'px Inter, "Segoe UI", system-ui, sans-serif';
    x.font = font;
    const w = Math.ceil(x.measureText(text).width) + pad * 2, h = fs + pad * 2;
    c.width = w * 2; c.height = h * 2; x.scale(2, 2); x.font = font;
    if (o.bg) { x.fillStyle = o.bg; const r = h / 2; x.beginPath(); x.moveTo(r, 0); x.arcTo(w, 0, w, h, r); x.arcTo(w, h, 0, h, r); x.arcTo(0, h, 0, 0, r); x.arcTo(0, 0, w, 0, r); x.fill(); }
    x.fillStyle = o.color || css('--ink-2'); x.textBaseline = 'middle'; x.fillText(text, pad, h / 2 + 1);
    const tex = new T.CanvasTexture(c); tex.minFilter = T.LinearFilter;
    const s = new T.Sprite(new T.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false }));
    const k = o.scale || 0.0125; s.scale.set(w * k, h * k, 1); s.renderOrder = 10;
    return s;
  }
  function box(w, h, d, color, o) {
    o = o || {};
    const m = new T.Mesh(new T.BoxGeometry(w, h, d), new T.MeshLambertMaterial({ color, transparent: true, opacity: o.opacity == null ? 1 : o.opacity, emissive: o.emissive || 0x000000, emissiveIntensity: o.ei == null ? 0 : o.ei }));
    return m;
  }
  function wire(w, h, d, color, opacity) {
    const l = new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(w, h, d)), new T.LineBasicMaterial({ color, transparent: true, opacity: opacity == null ? 0.5 : opacity }));
    return l;
  }
  function line(a, b, color, opacity) {
    const g = new T.BufferGeometry().setFromPoints([new T.Vector3(a[0], a[1], a[2]), new T.Vector3(b[0], b[1], b[2])]);
    return new T.Line(g, new T.LineBasicMaterial({ color, transparent: true, opacity: opacity == null ? 0.6 : opacity }));
  }
  function pick(mesh, info) { mesh.userData.info = info; G.picks.push(mesh); return mesh; }

  /* ------------------------------------------------------------ pointer + keyboard orbit */
  if (G.ok) {
    let down = null, moved = 0, pinch = null; const pts = new Map();
    cv.addEventListener('pointerdown', (e) => { pts.set(e.pointerId, [e.clientX, e.clientY]); down = [e.clientX, e.clientY]; moved = 0; G.dragging = true; try { cv.setPointerCapture(e.pointerId); } catch (err) {} });
    cv.addEventListener('pointermove', (e) => {
      if (pts.has(e.pointerId)) {
        const p = pts.get(e.pointerId), dx = e.clientX - p[0], dy = e.clientY - p[1];
        pts.set(e.pointerId, [e.clientX, e.clientY]);
        if (pts.size === 2) {

  function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

      NONE: { name: 'Source', fx: "'Revenue'", block: 'Revenue', dims: ['Product', 'Region', 'Month'], src: 'rev', axes: ['Month', 'Region', 'Product'], map: (c) => [[c.m, c.g, c.p]],
        info: { tag: 'doc', title: 'A metric is a sparse grid', body: '<p>Revenue is dimensioned by Product, Region and Month: 6 × 4 × 6 = 144 possible cells. Only the glowing ones hold a value. Pigment “does not store empty cells” and skips them when calculating, which is why a mostly blank metric is cheap.</p><p>The faint dots are intersections that exist in principle and cost nothing.</p>', src: ['arch', 'sparse'] } },
      BY: { name: 'BY', fx: "'Revenue'[BY SUM: 'Product'.'Category']", block: 'Revenue by Category', dims: ['Category', 'Region', 'Month'], src: 'rev', axes: ['Month', 'Region', 'Category'], map: (c) => [[c.m, c.g, catOf(c.p)]],
        info: { tag: 'doc', title: 'BY: regroup along a mapping', body: '<p>BY replaces Product with Category by following the Category property on each product. Populated cells slide into their category and add up; blanks contribute nothing, so the result is still sparse.</p><p>Aggregating this way keeps a link between each source cell and one target cell. The exact scope behaviour of BY is not spelled out in the scoping article; <code>BY CONSTANT</code> is listed there as losing scope.</p>', src: ['scope', 'hints'], act: ['studio:BY', 'Step through this formula in Formula Studio'] } },
      REMOVE: { name: 'REMOVE', fx: "'Revenue'[REMOVE SUM: 'Region']", block: 'Revenue all regions', dims: ['Product', 'Month'], src: 'rev', axes: ['Month', null, 'Product'], map: (c) => [[c.m, 0, c.p]],
        info: { tag: 'doc', title: 'REMOVE: collapse a dimension', body: '<p>REMOVE aggregates every region into one cell per Product and Month. The region axis flattens to a single layer.</p><p>Because each result cell now depends on all regions, the community guide notes that dependents recalculate across the whole removed dimension when any one item changes.</p>', src: ['arch'], act: ['studio:REMOVE', 'Step through this formula in Formula Studio'] } },
      ADD: { name: 'ADD', fx: "'Price'[ADD: 'Region']", block: 'Price by Region', dims: ['Product', 'Region', 'Month'], src: 'price', axes: ['Month', 'Region', 'Product'], map: (c) => [0, 1, 2, 3].map((g) => [c.m, g, c.p]),
        info: { tag: 'doc', title: 'ADD: copy across a new dimension', body: '<p>Price has no Region. ADD repeats each value on every region, so one populated cell becomes four. Pigment’s hints call ADD a last resort because the output is dense along the added dimension, and the scoping article lists ADD among the functions whose output scope is None.</p><p><code>ADD</code> followed by <code>FILTER</code> is worse: every cell is created first and then most are thrown away.</p>', src: ['hints', 'scope'], act: ['studio:ADD', 'Step through this formula in Formula Studio'] } },

  SCENES.cube = {

    build() {

          const t = label(a, { size: 26, weight: 600, color: css('--ink') }); t.position.set(i === 0 ? 0 : -h[0] - 2.3, i === 1 ? 0 : -h[1] - 1.0, i === 2 ? 0 : h[2] + 1.2); if (i === 1) t.position.set(-h[0] - 2.2, 0, h[2] + 0.3); G.group.add(t);

        const accent = col('--accent'), zero = col('--c-zero');

        elements: els,
        onPick(m) { if (m.userData.i != null) go(m.userData.i, true); },
        controls: () => '<div class="ctl"><button type="button" class="btn" data-act="prev"' + (st.step ? '' : ' disabled') + '>← Back</button><button type="button" class="btn primary" data-act="next"' + (st.step < PIPE.length - 1 ? '' : ' disabled') + '>Next station →</button></div><div class="legend"><span><i style="background:var(--c-calc)"></i>Documented</span><span><i style="background:var(--c-lost)"></i>Inferred</span><span><i style="background:var(--c-idle)"></i>Illustrative</span></div>',
        onAct(act) { if (act === 'next') go(st.step + 1); if (act === 'prev') go(st.step - 1); },
      };
    },
  };

  /* ============================================================ SCENE: access rights */
  const AR = {
    regions: ['AMER', 'EMEA', 'APAC', 'LATAM'], depts: ['Finance', 'Sales', 'HR', 'Ops'],
    r1: ['rw', 'rw', 'r', 'blank'],          // AR metric on Region
    r2: ['rw', 'r', 'none', 'rw'],           // AR metric on Department
    word: { rw: 'Read and write', r: 'Read only', none: 'No read, no write', blank: 'Blank' },
  };
  SCENES.access = {
    name: 'Access rights', eyebrow: 'Security evaluation', title: 'Who can see which cell',
    intro: 'Access rights are data too: rules are metrics, dimensioned by the lists they protect. Stack a role default and two rules, and the top layer shows what one member ends up with on every cell.',
    cam: { th: 0.7, ph: 1.0, r: 19, tx: -1.6 },
    info: { tag: 'doc', title: 'The most restrictive rule wins', body: '<ul><li>A role sets the default for the whole application. Most roles default to read and write; Reader has write off.</li><li>Each rule is an access rights metric holding Read / Write values per item.</li><li>A <b>blank</b> in a rule is restrictive: it results in no read and no write.</li><li>When several rules apply, the most restrictive permission takes over.</li></ul><p class="note">The member, lists and values are a made-up example. How Graphite evaluates rules at query time is not published.</p>', src: ['ar', 'arm'] },
    build() {
      const st = state.access, els = [];
      const order = { rw: 3, r: 2, none: 0, blank: 0 };
      const cell = (g, d) => {
        const parts = [['Role default', st.role === 'member' ? 'rw' : 'r']];
        if (st.r1) parts.push(['Region rule', AR.r1[g]]);
        if (st.r2) parts.push(['Department rule', AR.r2[d]]);
        let worst = parts[0]; parts.forEach((p) => { if (order[p[1]] < order[worst[1]]) worst = p; });
        return { v: order[worst[1]] === 3 ? 'rw' : order[worst[1]] === 2 ? 'r' : 'none', by: worst, parts };
      };
      const colOf = (v) => col(v === 'rw' ? '--ok' : v === 'r' ? '--c-lost' : '--c-idle');
      let nRW = 0, nR = 0, nN = 0;
      for (let g = 0; g < 4; g++) for (let d = 0; d < 4; d++) { const v = cell(g, d).v; if (v === 'rw') nRW++; else if (v === 'r') nR++; else nN++; }
      paintHud([['Read and write', nRW], ['Read only', nR], ['Hidden', nN, nN > 8]]);
      if (G.ok) {
        const layers = [
          { y: -3, t: 'Role default: ' + (st.role === 'member' ? 'Member' : 'Reader'), on: true, f: () => (st.role === 'member' ? 'rw' : 'r'), info: { tag: 'doc', title: 'Role default', body: '<p>Every member needs a role. The role sets the starting permission for the whole application: read and write for most roles, read only for Reader. Rules then restrict from there.</p>', src: ['ar'] } },
          { y: -1, t: 'Rule on Region', on: st.r1, f: (g) => AR.r1[g], info: { tag: 'doc', title: 'A rule dimensioned by Region', body: '<p>This access rights metric has one value per region for this member, so it paints stripes: the same answer for every department. LATAM is blank, and blank is restrictive.</p>', src: ['arm'] } },
          { y: 1, t: 'Rule on Department', on: st.r2, f: (g, d) => AR.r2[d], info: { tag: 'doc', title: 'A rule dimensioned by Department', body: '<p>A second rule, on a different dimension. It stripes the other way. HR is explicitly no read, no write.</p>', src: ['arm'] } },
        ];
        const P = (g, d, y) => [(d - 1.5) * 1.25, y, (g - 1.5) * 1.25];
        layers.forEach((L) => {
          for (let g = 0; g < 4; g++) for (let d = 0; d < 4; d++) {
            const v = L.f(g, d), p = P(g, d, L.y);
            const m = pick(box(1.1, 0.14, 1.1, v === 'blank' ? col('--surface') : colOf(v), { opacity: L.on ? 0.9 : 0.15 }), Object.assign({}, L.info, { title: L.info.title + (L.on ? '' : ' (switched off)') })); m.position.set(p[0], p[1], p[2]); G.group.add(m);
            if (v === 'blank' && L.on) { const w = wire(1.1, 0.14, 1.1, col('--bad'), 0.9); w.position.set(p[0], p[1], p[2]); G.group.add(w); }
          }
          const l = label(L.t, { size: 20, weight: 600, color: css(L.on ? '--ink' : '--faint') }); l.position.set(-5.4, L.y, 0); G.group.add(l);
        });
        for (let g = 0; g < 4; g++) for (let d = 0; d < 4; d++) {
          const c = cell(g, d), p = P(g, d, 3.2), hgt = c.v === 'rw' ? 0.9 : c.v === 'r' ? 0.45 : 0.12;
          const info = { tag: 'doc', title: AR.regions[g] + ' × ' + AR.depts[d] + ': ' + AR.word[c.v], body: '<ul>' + c.parts.map((x) => '<li>' + esc(x[0]) + ': <b>' + AR.word[x[1]] + '</b></li>').join('') + '</ul><p>Decided by the <b>' + esc(c.by[0].toLowerCase()) + '</b>' + (c.by[1] === 'blank' ? ', which is blank here. Blank overrides a read or write setting.' : c.v === 'rw' ? '; nothing restricts this cell.' : ', the most restrictive of the layers below.') + '</p>', src: ['ar', 'arm'] };
          const m = pick(box(1.1, hgt, 1.1, colOf(c.v), { opacity: 0.95 }), info); m.position.set(p[0], p[1] + hgt / 2, p[2]); G.group.add(m);
          G.group.add(line(P(g, d, -3), [p[0], p[1], p[2]], col('--faint'), 0.18));
          els.push({ label: AR.regions[g] + ' × ' + AR.depts[d], info, mesh: m });
        }
        const top = label('What Ava can do', { size: 22, weight: 600, bg: css('--surface'), color: css('--ink') }); top.position.set(-5.4, 3.6, 0); G.group.add(top);
        AR.depts.forEach((n, d) => { const s = label(n, { size: 17, color: css('--muted') }); s.position.set((d - 1.5) * 1.25, -3.5, 3.1); G.group.add(s); });
        AR.regions.forEach((n, g) => { const s = label(n, { size: 17, color: css('--muted') }); s.position.set(3.4, -3.3, (g - 1.5) * 1.25); G.group.add(s); });
      } else {
        for (let g = 0; g < 4; g++) for (let d = 0; d < 4; d++) { const c = cell(g, d); els.push({ label: AR.regions[g] + ' × ' + AR.depts[d], info: { tag: 'doc', title: AR.regions[g] + ' × ' + AR.depts[d] + ': ' + AR.word[c.v], body: '<p>Decided by the ' + esc(c.by[0].toLowerCase()) + '.</p>', src: ['ar'] } }); }
      }
      return {
        elements: els,
        controls: () => '<div><div class="sec-t">Ava’s role</div><div class="ctl"><button type="button" class="chipb" data-act="role:member" aria-pressed="' + (st.role === 'member') + '">Member (read and write)</button><button type="button" class="chipb" data-act="role:reader" aria-pressed="' + (st.role === 'reader') + '">Reader (read only)</button></div></div>' +
          '<div><div class="sec-t">Rules applied</div><div class="ctl"><button type="button" class="chipb" data-act="tog:r1" aria-pressed="' + st.r1 + '">Rule on Region</button><button type="button" class="chipb" data-act="tog:r2" aria-pressed="' + st.r2 + '">Rule on Department</button></div></div>' +
          '<div class="legend"><span><i style="background:var(--ok)"></i>Read and write</span><span><i style="background:var(--c-lost)"></i>Read only</span><span><i style="background:var(--c-idle)"></i>No access</span><span><i style="border:1.5px solid var(--bad)"></i>Blank in the rule</span></div>',
        onAct(act) { if (act.indexOf('role:') === 0) st.role = act.slice(5); if (act === 'tog:r1') st.r1 = !st.r1; if (act === 'tog:r2') st.r2 = !st.r2; state.info = null; setScene('access', true); },
      };
    },
  };

  /* ============================================================ SCENE: scenarios */
  function scnFresh() {
    const base = { Price: [10, 10, 10, 11, 11, 11], Volume: [5, 5, 6, 6, 7, 7], Discount: [1, 1, 1, 1, 1, 1] };
    const cp = (o) => JSON.parse(JSON.stringify(o));
    const up = cp(base), down = cp(base);
    up.Volume = [5, 6, 7, 8, 9, 10]; down.Price = [10, 9, 9, 9, 9, 9]; down.Discount = [1, 2, 2, 2, 2, 2];
    return { names: ['Default', 'Upside', 'Downside'], data: [base, up, down], seed: [cp(base), cp(base), cp(base)], log: 'Upside and Downside were created from Default, then edited.' };
  }
  SCENES.scenarios = {
    name: 'Scenarios', eyebrow: 'What-if layers', title: 'Scenarios as parallel layers of inputs',
    intro: 'Each plane is one scenario. They share the model and its formulas, but each carries its own inputs, so the same formula gives a different answer per layer. Tiles that differ from the layer’s starting point are outlined.',
    cam: { th: 0.6, ph: 1.05, r: 22, tx: -1.6 },
    info: { tag: 'doc', title: 'A scenario starts from a source', body: '<p>Turning scenarios on creates a Default Scenario that inherits all existing inputs and formulas. A new scenario is created from a source scenario you choose, which supplies its initial data.</p><p>Inputs can later be copied between scenarios: overrides, manual inputs and imported data, into any editable target.</p><p class="note">Drivers and numbers are a made-up example. How Graphite stores scenario data is not published.</p>', src: ['scn', 'scnCopy'] },
    build() {
      const S2 = state.scn || (state.scn = scnFresh()), els = [];
      const DR = ['Price', 'Volume', 'Discount'];
      const result = (d, m) => (d.Price[m] - d.Discount[m]) * d.Volume[m];
      const tot = (d) => [0, 1, 2, 3, 4, 5].reduce((a, m) => a + result(d, m), 0);
      paintHud(S2.names.map((n, i) => [n, tot(S2.data[i])]));
      if (G.ok) {
        const cols = ['--c-idle', '--ok', '--c-lost'];
        S2.names.forEach((n, i) => {
          const y = (i - 1) * 3.3, d = S2.data[i], seed = S2.seed[i];
          const plane = box(9.6, 0.06, 5.6, col('--surface'), { opacity: 0.5 }); plane.position.set(0.4, y - 0.1, 0); G.group.add(plane);
          const pw = wire(9.6, 0.06, 5.6, col(cols[i]), 0.8); pw.position.copy(plane.position); G.group.add(pw);
          const l = label(n, { size: 24, weight: 600, bg: css('--surface'), color: css('--ink') }); l.position.set(-5.6, y + 0.4, 2.8); G.group.add(l);
          DR.forEach((dr, r) => {
            for (let m = 0; m < 6; m++) {
              const changed = d[dr][m] !== seed[dr][m];
              const info = { tag: 'ill', title: n + ' · ' + dr + ' · M' + (m + 1) + ' = ' + d[dr][m], body: '<p>An input cell in the ' + esc(n) + ' scenario.' + (changed ? ' It was edited after the scenario was created (it started at ' + seed[dr][m] + '), so it differs from the source.' : ' It still holds the value the scenario started with.') + '</p>', src: ['scn'] };
              const t = pick(box(0.9, 0.12, 0.9, col(changed ? cols[i] : '--c-input'), { opacity: changed ? 0.95 : 0.55 }), info); t.position.set((m - 2.5) * 1.05 - 0.9, y, (r - 1) * 1.05 + 0.9); G.group.add(t);
              if (changed) { const w = wire(0.94, 0.16, 0.94, col('--ink'), 0.9); w.position.copy(t.position); G.group.add(w); }
            }
            if (i === 0) { const s = label(dr, { size: 16, color: css('--muted') }); s.position.set(-5.2, y, (r - 1) * 1.05 + 0.9); G.group.add(s); }
          });
          for (let m = 0; m < 6; m++) {
            const v = result(d, m), h = v / 42;
            const info = { tag: 'ill', title: n + ' · Revenue · M' + (m + 1) + ' = ' + v, body: '<div class="fx">(' + "'Price' - 'Discount') * 'Volume'" + '</div><p>The same formula in every scenario, evaluated on this layer’s inputs: (' + d.Price[m] + ' − ' + d.Discount[m] + ') × ' + d.Volume[m] + '.</p>', src: ['scn'] };
            const b = pick(box(0.7, h, 0.7, col('--accent'), { opacity: 0.9 }), info); b.position.set((m - 2.5) * 1.05 - 0.9, y + h / 2, -1.7); G.group.add(b);
          }
          els.push({ label: n + ' scenario', info: { tag: 'doc', title: n + ' scenario', body: '<p>Total revenue on this layer: <b>' + tot(d) + '</b>. ' + (i ? 'Created from Default.' : 'The Default Scenario: it inherited the model’s existing inputs and formulas when scenarios were switched on.') + '</p>', src: ['scn'] } });
        });
      }
      return {
        elements: els,
        controls: () => '<div><div class="sec-t">Try it</div><div class="ctl"><button type="button" class="chipb" data-act="s:default">Raise Price in Default</button><button type="button" class="chipb" data-act="s:upside">Raise Volume in Upside</button><button type="button" class="chipb" data-act="s:copy">Copy Default inputs → Downside</button><button type="button" class="btn" data-act="s:reset">Reset</button></div></div><p class="note">' + esc(S2.log) + '</p>',
        onAct(act) {
          if (act === 's:reset') { state.scn = scnFresh(); state.info = null; }
          if (act === 's:default') { S2.data[0].Price = S2.data[0].Price.map((v) => v + 1); S2.log = 'Default changed. Upside and Downside did not move.';
            state.info = { tag: 'inf', title: 'An edit in Default stays in Default', body: '<p>Price went up by 1 in the Default layer only. Pigment users report that scenarios behave as separate layers: once a scenario exists, later input changes in Default do not flow into it unless you copy them across.</p><p>This is reported on the community forum and consistent with the copy-inputs feature, but it is not stated in those words in the docs. A workspace setting, “Inputs and imports populate data across all Scenarios”, changes this for chosen blocks.</p>', src: ['scnComm', 'scnCopy'] }; }
          if (act === 's:upside') { S2.data[1].Volume = S2.data[1].Volume.map((v) => v + 1); S2.log = 'Upside changed. Only its layer recalculated.';
            state.info = { tag: 'inf', title: 'A scenario edit recalculates one layer', body: '<p>Only the Upside inputs changed, so only Upside results move. The formula is shared; the dependency graph is the same; the data differs.</p><p class="note">That the engine recalculates only the edited scenario is inferred from scoped recalculation, not stated in the scenario docs.</p>', src: ['scn', 'scope'] }; }
          if (act === 's:copy') { S2.data[2] = JSON.parse(JSON.stringify(S2.data[0])); S2.seed[2] = JSON.parse(JSON.stringify(S2.data[0])); S2.log = 'Downside now holds a copy of Default’s inputs.';
            state.info = { tag: 'doc', title: 'Copy inputs between scenarios', body: '<p>Pigment can copy overrides, manual inputs and imported data from one scenario to an editable target. After the copy the two layers match, and drift apart again as soon as either is edited.</p>', src: ['scnCopy'] }; }
          setScene('scenarios', true);
        },
      };
    },
  };

  /* ------------------------------------------------------------ deep links */
  function focus(p) {
    p = p || {};
    const f = p.focus && typeof p.focus === 'object' ? p.focus : (p.before || p.after || p.code ? p : null);
    if (f && !p.modifier) p = Object.assign({}, p, { modifier: f.modifier });
    let scene = p.scene, mod = p.modifier ? String(p.modifier).toUpperCase().replace(/[^A-Z]/g, '') : null;
    let mapped = '';
    if (mod === 'KEEP') { mod = 'REMOVE'; mapped = 'KEEP is REMOVE seen from the other side (it names the dimensions that stay), so the cube shows REMOVE.'; }
    if (mod === 'EXCLUDE') { mod = 'FILTER'; mapped = 'EXCLUDE is FILTER with the condition reversed, so the cube shows FILTER.'; }
    state.cube.ext = f && mod && CUBE.OPS[mod] ? { from: p.from || 'Formula Studio', modifier: String(f.modifier || mod).toUpperCase(), code: f.code, formula: f.formula, block: f.block, before: f.before, after: f.after, mapped } : null;
    if (mod && CUBE.OPS[mod]) { state.cube.op = mod; state.cube.stage = 'result'; scene = scene || 'cube'; state.info = CUBE.OPS[mod].info; setScene('cube', true); Object.assign(G.orbit, SCENES.cube.cam); G.home = Object.assign({ tx: 0, ty: 0, tz: 0 }, SCENES.cube.cam); return true; }
    if (scene && SCENES[scene]) { setScene(scene); return true; }
    return false;
  }
  window.__canvasReceive = function (msg) { if (!msg || (msg.target && msg.target !== 'graphite')) return false; const p = msg.payload || {}; focus({ scene: p.scene, modifier: p.modifier, focus: p.focus, from: p.from }); return true; };
  window.addEventListener('message', (e) => { const d = e.data; if (d && d.type === 'graphite:focus') focus(d); });
  function fromHash() {
    const h = decodeURIComponent(location.hash.slice(1)); if (!h) return false;
    const q = {}; h.split('&').forEach((kv) => { const i = kv.indexOf('='); if (i > 0) q[kv.slice(0, i)] = kv.slice(i + 1); });
    if (q.scene || q.modifier) return focus(q);
    const p = h.split('/'); return focus({ scene: p[0], modifier: p[1] });
  }
  window.addEventListener('hashchange', fromHash);

  /* ------------------------------------------------------------ theme: follow the shell (data-theme on <html>) */
  const root = document.documentElement;
  try { const pt = window.parent !== window && window.parent.document.documentElement.getAttribute('data-theme'); if (pt && !root.getAttribute('data-theme')) root.setAttribute('data-theme', pt); } catch (e) {}
  if (!root.getAttribute('data-theme')) root.setAttribute('data-theme', window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches && window.parent === window ? 'dark' : 'light');
  new MutationObserver(() => setScene(state.scene, true)).observe(root, { attributes: true, attributeFilter: ['data-theme'] });

  /* ------------------------------------------------------------ boot */
  $('#tabs').innerHTML = Object.keys(SCENES).map((k) => '<button type="button" role="tab" data-scene="' + k + '" aria-selected="false">' + esc(SCENES[k].name) + '</button>').join('');
  resize();
  if (!fromHash()) setScene('overview');
  if (G.ok) requestAnimationFrame(loop);
})();
</script>
</body>
</html>
